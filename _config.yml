# Resume settings
resume_avatar:                  "true"
resume_name:                    "Prakhar Sah"
resume_title:                   "Doctoral Student | CS@VT"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "sprakhar@vt.edu"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         "220 Gilbert Street, Level 4, Room #4305, Blacksburg, VA 24060"

resume_header_contact_info:     "220 Gilbert Street, Blacksburg, VA 24060 | sprakhar [at] vt.edu"
display_header_contact_info:    "true"

resume_header_intro: "<p>With 4+ years of experience in embedded systems, hardware security, and
                         intermittent computation, my research focuses on designing, evaluating, and
                         securing ultra-low-power embedded and batteryless devices. I approach
                         resource-constrained systems through a full-stack lens, combining
                         hardware/software co-design, bare-metal firmware development, system-level
                         benchmarking, and performance–energy tradeoff analysis. My research investigates
                         practical security challenges in deployed embedded platforms including
                         side-channel vulnerabilities, code-reuse threats, trusted execution environments,
                         secure checkpointing, and randomness under intermittent operation.</p>"

